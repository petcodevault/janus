name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore Janus.4.sln -PackagesDirectory packages

      - name: Build Release
        run: msbuild Janus.4.sln /t:Rebuild /p:Configuration=Release /p:Platform="Mixed Platforms" /m /v:minimal

      - name: Package release
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "ci-$env:GITHUB_RUN_NUMBER" }
          $packageName = "Janus-$version-win-x86.zip"
          $stagingDirectory = Join-Path $env:RUNNER_TEMP "janus-release"
          $packagePath = Join-Path $env:GITHUB_WORKSPACE $packageName

          New-Item -ItemType Directory -Path $stagingDirectory -Force | Out-Null
          Copy-Item -Path "Janus\bin\Release\*" -Destination $stagingDirectory -Recurse -Force
          Get-ChildItem -Path $stagingDirectory -Recurse -Include *.pdb,*.log | Remove-Item -Force
          Compress-Archive -Path "$stagingDirectory\*" -DestinationPath $packagePath -Force
          "PACKAGE_PATH=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: janus-release
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.PACKAGE_PATH }}
